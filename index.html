<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Visualização de Pauta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#hdr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#000;border-bottom:1px solid #333;flex-shrink:0}
.nav{background:#1a1a1a;border:none;color:#ccc;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.nav:hover{background:#2a2a2a}
#wlbl{font-size:12px;color:#aaa;min-width:110px;text-align:center}
#btn-today,#btn-refresh{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px}
#btn-today:hover,#btn-refresh:hover{background:#2a2a2a}
#btn-refresh{font-size:14px;padding:2px 8px}
#refresh-icon{display:inline-block}
#btn-refresh.spinning #refresh-icon{animation:spin .6s linear infinite}
#fperson,#ftipo,#fsetor{background:#1a1a1a;border:1px solid #333;color:#ddd;padding:4px 8px;border-radius:6px;font-size:12px}
/* Multi-select pessoa */
#fperson-wrap{position:relative}
#fperson-btn{background:#1a1a1a;border:1px solid #333;color:#ddd;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
#fperson-btn:hover{background:#2a2a2a}
#fperson-dd{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#1e1e1e;border:1px solid #444;border-radius:8px;z-index:500;min-width:170px;max-height:220px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,0.6)}
#fperson-dd.open{display:block}
#fperson-dd label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:#ddd;cursor:pointer;white-space:nowrap;user-select:none}
#fperson-dd label:hover{background:#2e2e2e}
#fperson-dd input[type=checkbox]{accent-color:#7c83f5;cursor:pointer}
.fperson-all{border-bottom:1px solid #333;margin-bottom:2px}
#search-wrap{position:relative;display:flex;align-items:center}
#fsearch{background:#1a1a1a;border:1px solid #333;color:#ddd;padding:4px 26px 4px 8px;border-radius:6px;font-size:12px;width:140px}
#fsearch::placeholder{color:#555}
#fsearch-clear{position:absolute;right:6px;background:none;border:none;color:#666;cursor:pointer;font-size:11px;display:none;padding:0;line-height:1}
#fsearch-clear.visible{display:block}
#fsearch-clear:hover{color:#ccc}
.admin-only{display:none}
#bcfg,#bpesos{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
#bcfg:hover,#bpesos:hover{background:#2a2a2a}

/* Timeline wrapper — scrolls horizontally */
#tl-outer{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#tl-wrap{flex:1;overflow-x:scroll;overflow-y:auto;user-select:none}
#tl-wrap::-webkit-scrollbar{height:10px;width:10px}
#tl-wrap::-webkit-scrollbar-track{background:#1a1a1a;border-radius:5px}
#tl-wrap::-webkit-scrollbar-thumb{background:#555;border-radius:5px;border:2px solid #1a1a1a}
#tl-wrap::-webkit-scrollbar-thumb:hover{background:#888}
#tl-wrap::-webkit-scrollbar-corner{background:#1a1a1a}
#tl-scroll{display:inline-flex;flex-direction:column;min-height:100%}

.name-col{width:150px;flex-shrink:0}
.days-header{display:flex;position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #333}
.days-header .name-col{border-right:1px solid #333;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 6px 3px;gap:3px;position:sticky;left:0;z-index:11}
/* Sort controls */
#sort-controls{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.sort-btn{background:#1a1a1a;border:1px solid #333;color:#888;padding:2px 6px;border-radius:4px;cursor:pointer;font-size:9px;white-space:nowrap}
.sort-btn:hover{background:#2a2a2a;color:#ccc}
.sort-btn.active{border-color:#7c83f5;color:#7c83f5}
.days-header-inner{display:flex}
.week-group{display:flex;flex-direction:column}
.week-label{font-size:9px;color:#555;padding:2px 4px;border-right:1px solid #2e3150;border-bottom:1px solid #2a2a2a;text-align:center;background:#000}
.week-days{display:flex}
.dh{width:115px;flex-shrink:0;padding:4px 4px 3px;text-align:center;font-size:10px;color:#666;border-right:1px solid #2e3150}
.dh:last-child{border-right:none}
.dh span{display:block;font-size:14px;font-weight:500;color:#ccc}
.dh.today{color:#7c83f5}
.dh.today span{color:#7c83f5}
.dh.wknd{background:#0e0e0e}
.dh.holiday{background:#2d1414}

.prow{display:flex;border-bottom:1px solid #222}
.pname{width:150px;flex-shrink:0;padding:8px 6px 8px;font-size:12px;font-weight:500;color:#ddd;border-right:1px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:grab;background:#000;position:sticky;left:0;z-index:5}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;color:#fff;overflow:hidden;border:2px solid rgba(255,255,255,0.1)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pname-text{font-size:10px;line-height:1.3;color:#ddd;text-align:center;word-break:break-word}
.pdays{display:flex;position:relative}
.pdcell{width:100px;flex-shrink:0;border-right:1px solid #1e1e1e}
.pdcell.today-col{background:rgba(124,131,245,0.07)}
.pdcell.wknd-col{background:#0e0e0e}
.pdcell.holiday-col{background:#1a0a0a}
.blk{position:absolute;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:4px 6px 3px 6px;transition:filter .1s;overflow:hidden;z-index:2}
.blk:hover{filter:brightness(1.15);z-index:5}
.blk.over{outline:2px solid #e03131}
.blk-job{font-weight:600;font-size:10px;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.blk-tp{font-size:9px;color:rgba(255,255,255,0.75);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.blk-st{font-size:9px;color:rgba(255,255,255,0.6);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rs-right{position:absolute;top:0;right:0;width:6px;height:100%;cursor:ew-resize;background:rgba(255,255,255,0);transition:background .15s}
.rs-bottom{position:absolute;bottom:0;left:0;width:100%;height:6px;cursor:ns-resize;background:rgba(255,255,255,0);transition:background .15s}
.rs-left{position:absolute;top:0;left:0;width:6px;height:100%;cursor:ew-resize;background:rgba(255,255,255,0);transition:background .15s}
.rs-top{position:absolute;top:0;left:0;width:100%;height:6px;cursor:ns-resize;background:rgba(255,255,255,0);transition:background .15s}
.blk:hover .rs-right,.blk:hover .rs-left{background:rgba(255,255,255,0.25)}
.blk:hover .rs-bottom,.blk:hover .rs-top{background:rgba(255,255,255,0.25)}
/* Menu três pontos */
.blk-menu-btn{position:absolute;top:3px;right:4px;width:18px;height:14px;background:rgba(0,0,0,0.35);border:none;border-radius:3px;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10;line-height:1;padding:0}
.blk:hover .blk-menu-btn{display:flex}
/* X por dia dentro do bloco */
.blk-day-x{position:absolute;top:2px;width:14px;height:14px;background:rgba(0,0,0,0.4);border:none;border-radius:3px;color:#fff;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:11;padding:0;line-height:1}
.blk:hover .blk-day-x{display:flex}
.blk-day-x:hover{background:rgba(220,50,50,0.8)}
.blk-ord{position:absolute;left:3px;width:16px;height:14px;background:rgba(0,0,0,0.35);border:none;border-radius:3px;color:#fff;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10;padding:0}
.blk-ord-up{top:3px}
.blk-ord-dn{bottom:3px}
.blk:hover .blk-ord{display:flex}
#blk-dd{position:fixed;background:#1e1e1e;border:1px solid #444;border-radius:8px;min-width:170px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,0.6);overflow:hidden;display:none}
.dd-label{padding:5px 12px 2px;font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.dd-item{padding:8px 14px;font-size:12px;color:#ddd;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dd-item:hover{background:#2e2e2e;color:#fff}
.dd-sep{height:1px;background:#333;margin:3px 0}

#loading{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;flex-direction:column;gap:12px}
.spinner{width:28px;height:28px;border:3px solid #2e3150;border-top-color:#7c83f5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#modal-overlay,#weights-panel,#access-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
#modal-overlay.open,#weights-panel.open,#access-panel.open{display:flex}
#modal,#weights-box,#access-box{background:#000;border:1px solid #333;border-radius:12px;padding:20px;min-width:300px}
#modal h3,#weights-box h3,#access-box h3{font-size:14px;font-weight:500;margin-bottom:14px;color:#fff}
/* Acesso */
#access-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;margin-bottom:12px}
.access-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;background:#111;font-size:12px;color:#ddd}
.access-item input[type=checkbox]{accent-color:#7c83f5;cursor:pointer;width:15px;height:15px}
#btn-save-access{width:100%;padding:8px;background:#7c83f5;border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
#btn-close-access{width:100%;margin-top:8px;padding:8px;background:#1a1a1a;border:1px solid #333;color:#ccc;border-radius:6px;cursor:pointer;font-size:12px}
/* Tooltip de feedback drag */
#drag-tip{position:fixed;background:rgba(20,20,20,0.92);border:1px solid #555;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;pointer-events:none;z-index:9999;display:none;white-space:nowrap}
#holiday-list{margin-bottom:12px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.h-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#ddd;background:#111;padding:6px 10px;border-radius:6px}
.h-del{background:none;border:none;color:#ef5350;cursor:pointer;font-size:14px}
#holiday-add{display:flex;gap:6px}
#holiday-input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:5px 8px;border-radius:6px;font-size:12px}
#btn-add-h{background:#7c83f5;color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
#btn-close-modal,#btn-close-w{width:100%;margin-top:8px;padding:8px;background:#1a1a1a;border:1px solid #333;color:#ccc;border-radius:6px;cursor:pointer;font-size:12px}
.w-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.w-row label{font-size:13px;color:#ccc}
.w-row input{width:70px;background:#111;border:1px solid #333;color:#fff;padding:5px 8px;border-radius:6px;font-size:13px;text-align:center}
#btn-save-w{width:100%;margin-top:4px;padding:8px;background:#7c83f5;border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:300;display:none}
#toast.show{display:block}
#toast.error{border-color:#e03131;color:#ff8787}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <button class="nav" id="bp">&#8592;</button>
    <button id="btn-today">Hoje</button>
    <button class="nav" id="bn">&#8594;</button>
    <span id="wlbl">–</span>
    <button id="btn-refresh" title="Atualizar dados"><span id="refresh-icon">↻</span></button>
    <div id="search-wrap">
      <input type="text" id="fsearch" placeholder="🔍 Pesquisar job..."/>
      <button id="fsearch-clear" title="Limpar">✕</button>
    </div>
    <select id="ftipo" class="admin-only"><option value="">Todos os tipos</option></select>
    <select id="fsetor" class="admin-only"><option value="">Todos os setores</option></select>
    <div id="fperson-wrap" class="admin-only">
      <button id="fperson-btn">Todas as pessoas</button>
      <div id="fperson-dd"></div>
    </div>
    <button id="bcfg" class="admin-only">&#128197; Feriados</button>
    <button id="bpesos" class="admin-only">&#9881; Pesos</button>
    <button id="baccess" class="main-admin-only" style="display:none">&#128275; Acesso</button>
  </div>
  <div id="loading"><div class="spinner"></div><span>Carregando...</span></div>
  <div id="tl-outer" style="display:none">
    <div id="tl-wrap">
      <div id="tl-scroll">
        <div class="days-header" id="days-header">
          <div class="name-col">
            <div id="sort-controls">
              <button class="sort-btn active" data-sort="custom">↕ Custom</button>
              <button class="sort-btn" data-sort="az">A→Z</button>
              <button class="sort-btn" data-sort="za">Z→A</button>
            </div>
          </div>
          <div id="days-header-inner" class="days-header-inner"></div>
        </div>
        <div id="rows"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="blk-dd"></div>
<div id="drag-tip"></div>

<div id="access-panel">
  <div id="access-box">
    <h3>&#128275; Controlo de acesso</h3>
    <p style="font-size:11px;color:#666;margin-bottom:10px">Pessoas com acesso alargado veem todos os filtros e todas as linhas.</p>
    <div id="access-list"></div>
    <button id="btn-save-access">Guardar</button>
    <button id="btn-close-access">Cancelar</button>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h3>&#128197; Feriados e dias bloqueados</h3>
    <div id="holiday-list"></div>
    <div id="holiday-add">
      <input type="date" id="holiday-input"/>
      <button id="btn-add-h">Adicionar</button>
    </div>
    <button id="btn-close-modal">Fechar</button>
  </div>
</div>

<div id="weights-panel">
  <div id="weights-box">
    <h3>&#9881; Pesos base por tipo</h3>
    <div id="w-rows"></div>
    <button id="btn-save-w">Salvar</button>
    <button id="btn-close-w">Cancelar</button>
  </div>
</div>

<script>

</script>
<script>
(function() {
  if (typeof mondaySdk === 'function') {
    initApp(mondaySdk());
  } else {
    document.getElementById('loading').innerHTML = '<span style="color:#ef5350">Erro: SDK não encontrado.</span>';
  }
})();

function initApp(monday) {
  const ADMIN_USER_ID = null;
  const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MON_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  // Paleta de 48 cores distintas via ângulo dourado — sem repetição visual
  const PALETTE = (function(){
    const out=[];
    for(let i=0;i<48;i++){
      const h=Math.round((i*137.508)%360);
      const s=52+((i%4)*8);
      const l=33+((i%3)*8);
      out.push(`hsl(${h},${s}%,${l}%)`);
    }
    return out;
  })();

  // ── Constantes de layout ──────────────────────────────────
  const NAME_W     = 150;
  const PX_PER_HS  = 18;
  const GAP        = 5;
  const WEEKS_BEFORE = 4;
  const WEEKS_AFTER  = 8;
  const TOTAL_DAYS   = (WEEKS_BEFORE + WEEKS_AFTER) * 7;
  const PAD = 4;

  // DAY_W dinâmico: 7 dias úteis visíveis no viewport
  const DAY_W = Math.max(70, Math.floor((window.innerWidth - NAME_W) / 7));
  const WEEK_PX = DAY_W * 7;

  let allData = [], personOrder = [], isAdmin = false, isMainAdmin = false;
  let subAdmins = []; // IDs com acesso alargado (carregado do Monday Storage)
  let selPersons = JSON.parse(localStorage.getItem('filter_persons_9mm') || '[]');
  let searchQuery = '';
  let selTipo  = localStorage.getItem('filter_tipo_9mm')  || '';
  let selSetor = localStorage.getItem('filter_setor_9mm') || '';
  let sortMode = localStorage.getItem('filter_sort_9mm')  || 'custom';
  let userPhotoMap = {};
  let userNameById = {};
  let holidays  = JSON.parse(localStorage.getItem('holidays_9mm') || '[]');
  let defaultHs = parseInt(localStorage.getItem('default_hs_9mm') || '8');

  // Extrai o código base do job (COD_NUM_ANO sem a letra final)
  // Aceita hífens ou underscores: ACC-0005-26F ou ACC_0005_26A → "ACC_0005_26"
  function jobPrefix(name) {
    const n = (name||'').replace(/[-_]/g, '_').toUpperCase();
    const m = n.match(/^([A-Z]{2,5}_\d{2,6}_\d{2})/);
    return m ? m[1] : null;
  }

  function relatedJobs(jobName) {
    const pfx = jobPrefix(jobName);
    if(!pfx) return [];
    return Object.entries(allJobs)
      .filter(([, name]) => jobPrefix(name) === pfx)
      .map(([id, name]) => ({ id, name }));
  }

  // Cores determinísticas por código de cliente — hash garante sempre a mesma cor
  const cliColors = {};
  function hashStr(s) {
    let h = 2166136261;
    for(let i=0;i<s.length;i++) h = Math.imul(h^s.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function cliColor(c) {
    if(!cliColors[c]) cliColors[c] = PALETTE[hashStr(c) % PALETTE.length];
    return cliColors[c];
  }
  const avColors = ['#5c7cfa','#f06595','#ffa94d','#51cf66','#cc5de8','#22b8cf','#ff6b6b','#74c0fc'];
  const avMap = {}; let ai = 0;
  function avColor(n) { if(!avMap[n]){ avMap[n]=avColors[ai%avColors.length]; ai++; } return avMap[n]; }
  function initials(n) { return (n||'?').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

  // ── Toast ─────────────────────────────────────────────────
  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = isError ? 'show error' : 'show';
    setTimeout(() => { t.className=''; }, 3000);
  }

  // ── Datas utilitárias ─────────────────────────────────────
  function fmtD(d) { return d.toISOString().split('T')[0]; }
  function isToday(d) { return fmtD(d) === fmtD(new Date()); }
  function isWknd(d)  { return d.getDay()===0 || d.getDay()===6; }
  function isHoliday(d) { return holidays.includes(fmtD(d)); }
  function isBlocked(d) { return isWknd(d) || isHoliday(d); }

  // Segunda-feira da semana atual
  function thisMonday() {
    const t = new Date(); const dw = t.getDay();
    const m = new Date(t);
    m.setDate(t.getDate() - (dw===0 ? 6 : dw-1));
    m.setHours(12,0,0,0);
    return m;
  }

  // Gera todos os dias renderizados (WEEKS_BEFORE semanas atrás → WEEKS_AFTER à frente)
  function getAllDays() {
    const mon = thisMonday();
    const start = new Date(mon);
    start.setDate(mon.getDate() - WEEKS_BEFORE*7);
    return Array.from({length: TOTAL_DAYS}, (_,i) => {
      const d = new Date(start); d.setDate(start.getDate()+i); return d;
    });
  }

  // Índice do "hoje" dentro do array de dias
  function todayIndex(days) {
    const td = fmtD(new Date());
    return days.findIndex(d => fmtD(d)===td);
  }

  // Posição X do scroll para mostrar a semana do dia de índice idx
  function scrollXForIndex(idx) {
    return Math.max(0, idx * DAY_W - 50); // um pouco antes do dia
  }

  // ── Navegação ─────────────────────────────────────────────
  // Ao invés de re-renderizar, só muda o scroll
  function scrollByWeeks(n) {
    const wrap = document.getElementById('tl-wrap');
    wrap.scrollBy({ left: n * WEEK_PX, behavior: 'smooth' });
  }

  function scrollToToday() {
    const days = getAllDays();
    const idx = todayIndex(days);
    if(idx < 0) return;
    const wrap = document.getElementById('tl-wrap');
    wrap.scrollTo({ left: scrollXForIndex(idx), behavior: 'smooth' });
    updateWeekLabel(days);
  }

  function updateWeekLabel(days) {
    // Mostra o intervalo de dias visíveis baseado no scroll
    const wrap = document.getElementById('tl-wrap');
    const scrollLeft = wrap.scrollLeft;
    const viewW = wrap.clientWidth - NAME_W;
    const startIdx = Math.max(0, Math.floor(scrollLeft / DAY_W));
    const endIdx   = Math.min(days.length-1, Math.floor((scrollLeft + viewW) / DAY_W));
    const s = days[startIdx], e = days[endIdx];
    if(s && e) {
      document.getElementById('wlbl').textContent =
        `${s.getDate()} ${MON_PT[s.getMonth()]} – ${e.getDate()} ${MON_PT[e.getMonth()]} ${e.getFullYear()}`;
    }
  }

  // ── Fetch ─────────────────────────────────────────────────
  async function fetchData(bId) {
    let allItems = [], cursor = null;
    do {
      const cursorPart = cursor ? `, cursor: "${cursor}"` : '';
      const query = `query {
        boards(ids: [${bId}]) {
          items_page(limit: 200${cursorPart}) {
            cursor
            items {
              id name
              subitems {
                id name
                board { id columns { id title type } }
                column_values { id text value }
              }
            }
          }
        }
      }`;
      const res = await monday.api(query);
      const page = res.data.boards[0].items_page;
      allItems = allItems.concat(page.items);
      cursor = page.cursor || null;
    } while(cursor);
    return allItems;
  }

  // ── Parse de datas ────────────────────────────────────────
  function parseRange(str) {
    if(!str) return null;
    str = str.trim();
    if(str.match(/^\d{4}-\d{2}-\d{2}$/)) return { start:new Date(str+'T12:00:00'), end:new Date(str+'T12:00:00') };
    const iso = str.match(/(\d{4}-\d{2}-\d{2})\s*-\s*(\d{4}-\d{2}-\d{2})/);
    if(iso) return { start:new Date(iso[1]+'T12:00:00'), end:new Date(iso[2]+'T12:00:00') };
    const MONTHS={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
    function parsePT(s){
      s=s.trim().toLowerCase();
      const m=s.match(/^(\d+)\s+([a-z]+)(?:\s+(\d{4}))?$/);
      if(!m) return null;
      const mo=MONTHS[m[2].slice(0,3)];
      if(mo===undefined) return null;
      return new Date(m[3]?parseInt(m[3]):new Date().getFullYear(),mo,parseInt(m[1]),12);
    }
    if(str.includes(' - ')){ const p=str.split(' - '); const s=parsePT(p[0]),e=parsePT(p[1]); if(s&&e) return{start:s,end:e}; }
    const d=parsePT(str);
    return d?{start:d,end:d}:null;
  }

  // ── Processa itens ────────────────────────────────────────
  function processItems(items) {
    const personMap = {};

    // Pré-monta mapa de job → subitens resumidos (para o menu de contexto)
    const jobSubsMap = {};
    items.forEach(item => {
      jobSubsMap[item.id] = (item.subitems || []).map(sub => {
        const ctm = {};
        if(sub.board && sub.board.columns) sub.board.columns.forEach(c => ctm[c.id]=c.title);
        const cols = {};
        sub.column_values.forEach(c => { cols[ctm[c.id]||c.id] = c.text; });
        return { subId: sub.id, tipo: cols['Tipo']||sub.name||'Subitem' };
      });
    });
    items.forEach(item => {
      const jobName = item.name || '';
      const clientCode = jobName.slice(0,3).toUpperCase();
      (item.subitems || []).forEach(sub => {
        const colTitleMap={}, colTypeMap={};
        if(sub.board && sub.board.columns)
          sub.board.columns.forEach(c=>{ colTitleMap[c.id]=c.title; colTypeMap[c.id]=c.type; });
        const cols={}, colIds={};
        sub.column_values.forEach(c=>{ const t=colTitleMap[c.id]||c.id; cols[t]=c.text; colIds[t]=c.id; });
        const resp = cols['Resp.']||cols['Responsável']||cols['Resp']||'';
        const cronograma = cols['Cronograma']||'';
        const tipo = cols['Tipo']||'';
        const status = cols['Status']||'';
        const setor = cols['Setor']||'';
        // HSD: "8 0 0 8 8" — um valor por dia útil, espaço como separador
        const hsdText = (cols['HSD']||'').trim();
        const hsd = hsdText ? hsdText.split(/\s+/).map(Number).filter(n=>!isNaN(n)) : null;
        // Fallback: HS simples para jobs antigos sem HSD
        const hsText = (cols['HS']||'').trim();
        const hsRaw = parseInt(hsText);
        const hsFallback = (!hsText||isNaN(hsRaw)) ? defaultHs : hsRaw;
        if(!resp||!cronograma) return;
        const range = parseRange(cronograma);
        if(!range) return;
        if(!personMap[resp]) personMap[resp]={ person:resp, subitems:[] };
        personMap[resp].subitems.push({
          subId:sub.id, boardId:sub.board?sub.board.id:null,
          parentId: item.id,
          siblings: jobSubsMap[item.id] || [],
          cronColId:colIds['Cronograma']||null,
          hsdColId:colIds['HSD']||null,
          hsFallback, hsd,
          jobName:sub.name||jobName, clientCode, tipo, setor, status, range
        });
      });
    });
    return Object.values(personMap);
  }

  // ── Update Monday ─────────────────────────────────────────
  async function updateRange(sub, newStart, newEnd) {
    if(!sub.boardId||!sub.cronColId){ showToast('Coluna Cronograma não encontrada.',true); return; }
    try {
      const val = JSON.stringify({ from: fmtD(newStart), to: fmtD(newEnd) });
      const query = `mutation {
        change_column_value(board_id: ${sub.boardId}, item_id: ${sub.subId}, column_id: "${sub.cronColId}", value: ${JSON.stringify(val)}) { id }
      }`;
      await monday.api(query);
      showToast('Datas atualizadas!');
    } catch(err) {
      const msg = (err?.message||'').slice(0,80) || JSON.stringify(err).slice(0,80);
      console.error('Erro datas:', err);
      showToast('Erro: ' + msg, true);
    }
  }

  async function updateHSD(sub, newHsdArray) {
    if(!sub.boardId||!sub.hsdColId){ showToast('Coluna HSD não encontrada.',true); return; }
    try {
      const val = newHsdArray.join(' ');
      const query = `mutation {
        change_simple_column_value(board_id: ${sub.boardId}, item_id: ${sub.subId}, column_id: "${sub.hsdColId}", value: ${JSON.stringify(val)}) { id }
      }`;
      await monday.api(query);
      sub.hsd = newHsdArray;
      showToast('HSD actualizado!');
    } catch(err) {
      const msg=(err?.message||'').slice(0,60);
      console.error('Erro HSD:',err);
      showToast('Erro: '+msg, true);
    }
  }

  async function fetchUsers() {
    try {
      const res = await monday.api(`query { users { id name photo_thumb } }`);
      (res.data.users || []).forEach(u => {
        if(u.name) {
          userNameById[String(u.id)] = u.name;
          if(u.photo_thumb) userPhotoMap[u.name] = u.photo_thumb;
        }
      });
    } catch(e) { console.warn('Erro ao buscar users:', e); }
  }

  let subOrder = JSON.parse(localStorage.getItem('subOrder_9mm') || '{}');
  // subOrder[person] = [subId, subId, ...] — ordem customizada dos subitems
  const undoStack = [];
  const MAX_UNDO = 30;

  function pushUndo(type, sub, prevVal) {
    undoStack.push({ type, sub, prevVal });
    if(undoStack.length > MAX_UNDO) undoStack.shift();
  }

  // Ctrl+Z — desfaz a última ação
  document.addEventListener('keydown', async e => {
    if(!(e.ctrlKey || e.metaKey) || e.key !== 'z') return;
    e.preventDefault();
    if(!undoStack.length) { showToast('Nada para desfazer.'); return; }
    const action = undoStack.pop();
    showToast('Desfazendo...');
    try {
      if(action.type === 'hs') {
        action.sub.hsd = action.prevVal;
        await updateHSD(action.sub, action.prevVal);
      } else if(action.type === 'range') {
        action.sub.range.start = action.prevVal.start;
        action.sub.range.end   = action.prevVal.end;
        await updateRange(action.sub, action.prevVal.start, action.prevVal.end);
      }
      render();
      showToast('↩ Ação desfeita!');
    } catch(err) {
      showToast('Erro ao desfazer.', true);
    }
  });

  let currentBoardId = null;

  async function refreshData(silent = false) {
    if(!currentBoardId) return;
    const btn = document.getElementById('btn-refresh');
    if(btn) btn.classList.add('spinning');
    if(!silent) showToast('Atualizando dados...');
    try {
      const items = await fetchData(currentBoardId);
      allData = processItems(items);
      await fetchUsers();
      populateFilter();
      populateTipo();
      populateSetor();
      render();
      if(!silent) showToast('Dados atualizados!');
    } catch(err) {
      console.error('Erro ao atualizar:', err);
      showToast('Erro ao atualizar dados.', true);
    } finally {
      if(btn) btn.classList.remove('spinning');
    }
  }

  // Auto-refresh a cada 2 minutos
  setInterval(() => refreshData(true), 2 * 60 * 1000);

  // Atualiza automaticamente quando algo muda no board
  let refreshTimer = null;
  monday.listen('events', () => {
    // Debounce: espera 1.5s após o último evento antes de atualizar
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => refreshData(true), 1500);
  });

  async function loadSubAdmins() {
    try {
      const r = await monday.storage.getItem('sub_admins_9mm');
      subAdmins = r.data?.value ? JSON.parse(r.data.value) : [];
    } catch(e) { subAdmins = []; }
  }

  async function saveSubAdmins() {
    try { await monday.storage.setItem('sub_admins_9mm', JSON.stringify(subAdmins)); }
    catch(e) { showToast('Erro ao guardar acesso.', true); }
  }

  function openAccessPanel() {
    const list = document.getElementById('access-list');
    list.innerHTML = '';
    // Lista todos os utilizadores do board
    const names = [...new Set(allData.map(p=>p.person))].sort((a,b)=>a.localeCompare(b));
    names.forEach(name => {
      const uid = Object.keys(userNameById).find(id => userNameById[id] === name) || '';
      const item = document.createElement('div'); item.className='access-item';
      const ck = document.createElement('input'); ck.type='checkbox'; ck.dataset.uid=uid; ck.dataset.name=name;
      ck.checked = uid && subAdmins.includes(uid);
      item.appendChild(ck);
      const lbl = document.createElement('span'); lbl.textContent = name;
      item.appendChild(lbl);
      list.appendChild(item);
    });
    document.getElementById('access-panel').classList.add('open');
  }

  document.getElementById('btn-save-access').addEventListener('click', async () => {
    subAdmins = [...document.querySelectorAll('#access-list input:checked')]
      .map(c => c.dataset.uid).filter(Boolean);
    await saveSubAdmins();
    document.getElementById('access-panel').classList.remove('open');
    showToast('Acesso guardado!');
  });
  document.getElementById('btn-close-access').addEventListener('click', () => {
    document.getElementById('access-panel').classList.remove('open');
  });
  document.getElementById('baccess').addEventListener('click', openAccessPanel);

  // Tooltip de feedback drag
  const dragTip = document.getElementById('drag-tip');
  function showDragTip(text, x, y) {
    dragTip.textContent = text;
    dragTip.style.display = 'block';
    dragTip.style.left = (x+14)+'px';
    dragTip.style.top  = (y+14)+'px';
  }
  function hideDragTip() { dragTip.style.display = 'none'; }

  // ── Render ────────────────────────────────────────────────
  function render() {
    const days = getAllDays();

    // ── Altura global uniforme ────────────────────────────────
    // Calcula o maior empilhamento de HS num mesmo dia (em qualquer pessoa)
    // para que TODAS as linhas tenham exatamente a mesma altura.
    // ROW_H: zona normal (8HS) + espaço para blocos overflow compactos
    const NORMAL_HS = 8;
    const NORMAL_H  = NORMAL_HS * PX_PER_HS;
    const COMPACT_H = Math.round(PX_PER_HS * 0.85);

    // Pré-calcula o maior número de blocos overflow em qualquer dia/pessoa
    let maxOverflow = 0;
    (selPersons.length > 0 ? allData.filter(p=>selPersons.includes(p.person)) : allData).forEach(p => {
      const ord = subOrder[p.person] || [];
      const sSubs = [...p.subitems].sort((a,b)=>{
        const ia=ord.indexOf(a.subId),ib=ord.indexOf(b.subId);
        if(ia===-1&&ib===-1) return 0; if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib;
      });
      days.forEach(d => {
        if(isBlocked(d)) return;
        const ds=fmtD(d);
        let runHs=0, ov=0;
        sSubs.forEach(sub => {
          const ss=fmtD(sub.range.start),se=fmtD(sub.range.end);
          if(ds<ss||ds>se) return;
          if(runHs>=NORMAL_HS) ov++;
          runHs+=sub.hsFallback;
        });
        if(ov>maxOverflow) maxOverflow=ov;
      });
    });
    const ROW_H = PAD*2 + NORMAL_H + (maxOverflow>0 ? maxOverflow*(COMPACT_H+GAP) : 0);

    // Cabeçalho de dias agrupado por semana
    const dhi = document.getElementById('days-header-inner');
    dhi.innerHTML = '';
    for(let w=0; w<TOTAL_DAYS/7; w++) {
      const weekDays = days.slice(w*7, w*7+7);
      const wg = document.createElement('div'); wg.className='week-group';
      const mon = weekDays[0];
      const lbl = document.createElement('div'); lbl.className='week-label';
      lbl.textContent = `${mon.getDate()} ${MON_PT[mon.getMonth()]} ${mon.getFullYear()}`;
      lbl.style.width = (DAY_W*7)+'px';
      const wd = document.createElement('div'); wd.className='week-days';
      weekDays.forEach(d => {
        const el = document.createElement('div');
        el.className = 'dh'+(isToday(d)?' today':'')+(isWknd(d)?' wknd':'')+(isHoliday(d)?' holiday':'');
        el.style.width = DAY_W+'px';
        el.innerHTML = `${DAYS_PT[d.getDay()]}<span>${d.getDate()}</span>`;
        wd.appendChild(el);
      });
      wg.appendChild(lbl); wg.appendChild(wd); dhi.appendChild(wg);
    }

    let data = allData;
    // Filtro pessoa (multi)
    if(selPersons.length > 0) data = data.filter(p => selPersons.includes(p.person));
    // Filtro search + tipo (sem modificar allData)
    if(searchQuery || selTipo || selSetor) {
      data = data.map(p => ({
        ...p,
        subitems: p.subitems.filter(sub => {
          const okSearch = !searchQuery || sub.jobName.toLowerCase().includes(searchQuery.toLowerCase());
          const okTipo   = !selTipo   || sub.tipo === selTipo;
          const okSetor  = !selSetor  || sub.setor === selSetor;
          return okSearch && okTipo && okSetor;
        })
      })).filter(p => p.subitems.length > 0);
    }
    data = [...data].sort((a,b)=>{
      if(sortMode === 'az') return a.person.localeCompare(b.person);
      if(sortMode === 'za') return b.person.localeCompare(a.person);
      // custom — mantém a ordem do drag
      const ia=personOrder.indexOf(a.person), ib=personOrder.indexOf(b.person);
      if(ia===-1&&ib===-1) return 0; if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib;
    });

    const rows = document.getElementById('rows'); rows.innerHTML='';

    data.forEach(p => {
      const row = document.createElement('div');
      row.className='prow'; row.style.minHeight=ROW_H+'px';

      // Nome (sticky esquerda)
      const nc = document.createElement('div'); nc.className='pname';
      nc.style.width=NAME_W+'px'; nc.draggable=true; nc.dataset.person=p.person;
      const av = document.createElement('div'); av.className='av';
      av.style.background = avColor(p.person);
      if(userPhotoMap[p.person]) {
        const img = document.createElement('img');
        img.src = userPhotoMap[p.person]; img.alt = initials(p.person);
        av.appendChild(img);
      } else {
        av.textContent = initials(p.person);
      }
      const ns = document.createElement('div'); ns.className='pname-text'; ns.textContent=p.person;
      nc.appendChild(av); nc.appendChild(ns); row.appendChild(nc);

      // Drag para reordenar linhas
      nc.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain',p.person); nc.style.opacity='0.4'; });
      nc.addEventListener('dragend', ()=>{ nc.style.opacity='1'; });
      nc.addEventListener('dragover', e=>{ e.preventDefault(); nc.style.background='#2e3150'; });
      nc.addEventListener('dragleave', ()=>{ nc.style.background=''; });
      nc.addEventListener('drop', e=>{
        e.preventDefault(); nc.style.background='';
        const from=e.dataTransfer.getData('text/plain'), to=p.person;
        if(from===to) return;
        if(!personOrder.length) personOrder=data.map(d=>d.person);
        const fi=personOrder.indexOf(from);
        if(fi>-1) personOrder.splice(fi,1);
        personOrder.splice(personOrder.indexOf(to),0,from);
        localStorage.setItem('order_9mm',JSON.stringify(personOrder));
        render();
      });

      // Células de dias
      const pdays = document.createElement('div'); pdays.className='pdays';
      pdays.style.width=(TOTAL_DAYS*DAY_W)+'px'; pdays.style.position='relative';
      days.forEach(d=>{
        const cell=document.createElement('div');
        cell.className='pdcell'+(isToday(d)?' today-col':'')+(isWknd(d)?' wknd-col':'')+(isHoliday(d)?' holiday-col':'');
        cell.style.width=DAY_W+'px';
        pdays.appendChild(cell);
      });
      row.appendChild(pdays); rows.appendChild(row);

      // Ordena subitems por ordem customizada
      const ord = subOrder[p.person] || [];
      const sortedSubs = [...p.subitems].sort((a,b)=>{
        const ia=ord.indexOf(a.subId), ib=ord.indexOf(b.subId);
        if(ia===-1&&ib===-1) return 0; if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib;
      });

      // Blocos com HSD: array de horas por dia útil
      const blocks=[];
      sortedSubs.forEach(sub=>{
        const workDays=[];
        days.forEach((d,i)=>{
          const ds=fmtD(d),ss=fmtD(sub.range.start),se=fmtD(sub.range.end);
          if(ds>=ss&&ds<=se&&!isBlocked(d)) workDays.push({dayIndex:i,workPos:workDays.length});
        });
        if(workDays.length===0) return;

        const hsAt = wp => {
          if(!sub.hsd||sub.hsd.length===0) return sub.hsFallback;
          return sub.hsd[Math.min(wp, sub.hsd.length-1)];
        };

        let segStart=-1, segHs=null, segWpStart=-1;
        workDays.forEach(({dayIndex,workPos},k)=>{
          const curHs=hsAt(workPos);
          const consecutive=k>0&&workDays[k-1].dayIndex===dayIndex-1;
          if(curHs===0){
            if(segStart!==-1){ blocks.push({sub,colStart:segStart,colEnd:workDays[k-1].dayIndex,dayHs:segHs,wpStart:segWpStart,wpEnd:workPos-1}); segStart=-1; segHs=null; segWpStart=-1; }
            return;
          }
          if(segStart===-1){ segStart=dayIndex; segHs=curHs; segWpStart=workPos; }
          else if(!consecutive){
            blocks.push({sub,colStart:segStart,colEnd:workDays[k-1].dayIndex,dayHs:segHs,wpStart:segWpStart,wpEnd:workPos-1});
            segStart=dayIndex; segHs=curHs; segWpStart=workPos;
          }
          // Mesmo sub, consecutivo, HS diferente → novo bloco mas sem gap visual
          else if(curHs!==segHs){
            blocks.push({sub,colStart:segStart,colEnd:workDays[k-1].dayIndex,dayHs:segHs,wpStart:segWpStart,wpEnd:workPos-1,noGapRight:true});
            segStart=dayIndex; segHs=curHs; segWpStart=workPos;
          }
        });
        if(segStart!==-1) blocks.push({sub,colStart:segStart,colEnd:workDays[workDays.length-1].dayIndex,dayHs:segHs,wpStart:segWpStart,wpEnd:workDays[workDays.length-1].workPos});
      });

      // Post-processamento: marca noGapLeft nos blocos que seguem um noGapRight do mesmo sub
      for(let k=1;k<blocks.length;k++){
        if(blocks[k-1].noGapRight && blocks[k-1].sub.subId===blocks[k].sub.subId)
          blocks[k].noGapLeft=true;
      }

      const parent=blocks.map((_,i)=>i);
      function find(x){ while(parent[x]!==x) x=parent[x]; return x; }
      function union(a,b){ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; }
      for(let i=0;i<blocks.length;i++)
        for(let j=i+1;j<blocks.length;j++)
          if(!(blocks[j].colEnd<blocks[i].colStart||blocks[j].colStart>blocks[i].colEnd)) union(i,j);
      const clusters={};
      blocks.forEach((b,i)=>{ const r=find(i); (clusters[r]=clusters[r]||[]).push(b); });

      Object.values(clusters).forEach(cluster=>{
        const bHs = b => b.dayHs ?? b.sub.hsFallback;
        const sum=cluster.reduce((acc,b)=>acc+bHs(b),0);
        const over=sum>NORMAL_HS;
        const N=cluster.length;
        // Blocos normais (soma ≤ 8): altura fixa por HS
        // Blocos que ultrapassam 8HS: aparecem abaixo compactos (COMPACT_H cada)
        // Agrupa blocos por sub para que dias consecutivos do mesmo job
        // partilhem o mesmo topOffset (visualmente colados mesmo com HS diferentes)
        const subTopMap = {}; // subId → topOffset
        const subMaxH   = {}; // subId → altura máxima
        cluster.forEach(b => {
          const sid = b.sub.subId;
          const h = Math.max(16, Math.round((b.dayHs??b.sub.hsFallback)*PX_PER_HS));
          if(subMaxH[sid] === undefined) subMaxH[sid] = h;
          else subMaxH[sid] = Math.max(subMaxH[sid], h);
        });

        // Atribui topOffset por sub respeitando a ordem original do cluster
        const seenSubs = [];
        cluster.forEach(b => {
          const sid = b.sub.subId;
          if(!seenSubs.includes(sid)) { seenSubs.push(sid); }
        });
        let tOff = PAD;
        seenSubs.forEach(sid => { subTopMap[sid] = tOff; tOff += subMaxH[sid] + GAP; });

        let runningHs=0;
        cluster.forEach(({sub,colStart,colEnd,dayHs,wpStart,wpEnd,noGapRight,noGapLeft})=>{
          const sid = sub.subId;
          const thisHs = dayHs ?? sub.hsFallback;
          const isOverflow = runningHs >= NORMAL_HS;
          const blkH = isOverflow ? COMPACT_H : Math.max(16, Math.round(thisHs * PX_PER_HS));
          runningHs += thisHs;
          const topOffset = subTopMap[sid];
          // Remove margem direita se o próximo bloco é o mesmo sub (colados)
          const left  = colStart*DAY_W + 3;
          const width = noGapRight
            ? (colEnd-colStart+1)*DAY_W - 3
            : (colEnd-colStart+1)*DAY_W - 6;
          const isConcluido = /concluí/i.test(sub.status||'');
          const isAndamento = /andamento|pausad/i.test(sub.status||'');
          let extraStyle = '';
          if(isConcluido) extraStyle += 'opacity:0.58;';
          if(isAndamento) extraStyle += 'outline:2px solid rgba(255,255,255,0.75);outline-offset:-2px;';
          const rL = noGapLeft  ? 0 : 5;
          const rR = noGapRight ? 0 : 5;
          const br = `${rL}px ${rR}px ${rR}px ${rL}px`;
          const blk=document.createElement('div');
          blk.className='blk'+(over?' over':'');
          blk.style.cssText=`left:${left}px;width:${width}px;top:${topOffset}px;height:${blkH}px;background:${cliColor(sub.clientCode)};border-radius:${br};${extraStyle}`;
          if(isOverflow) blk.style.opacity = (parseFloat(blk.style.opacity)||1) * 0.7 + '';
          blk.title = sub.jobName;
          const showSub = blkH >= 26;
          blk.innerHTML = `<div class="blk-job">${sub.jobName}</div>`
            + (showSub && sub.status ? `<div class="blk-tp">${sub.status} · HS ${thisHs}</div>` : '');

          // X por dia — posicionado em cada coluna do bloco
          const totalDaysInSeg = colEnd - colStart + 1;
          const nonZeroCount = (sub.hsd||[]).filter(v=>v>0).length || 1;
          for(let di=0; di<totalDaysInSeg; di++){
            const wp = (wpStart??0) + di;
            const xBtn = document.createElement('button');
            xBtn.className = 'blk-day-x';
            xBtn.textContent = '×';
            xBtn.style.left = (di * DAY_W + DAY_W/2 - 7) + 'px';
            xBtn.title = `Zerar dia ${di+1}`;
            // Não mostra X se for o último dia não-zero
            if(nonZeroCount <= 1) xBtn.style.display='none';
            xBtn.addEventListener('click', e => {
              e.stopPropagation();
              const currentHsd = sub.hsd ? [...sub.hsd] : Array(wp+1).fill(thisHs);
              // Garante que o array tem posições suficientes
              while(currentHsd.length <= wp) currentHsd.push(currentHsd[currentHsd.length-1] ?? thisHs);
              const newHsd = [...currentHsd];
              newHsd[wp] = 0;
              // Não permite ficar tudo a zero
              if(newHsd.filter(v=>v>0).length === 0) { showToast('Não podes apagar o último dia.', true); return; }
              pushUndo('hs', sub, [...currentHsd]);
              sub.hsd = newHsd;
              updateHSD(sub, newHsd);
              render();
            });
            blk.appendChild(xBtn);
          }

          // Handle direito — altera data fim
          const rsR = document.createElement('div'); rsR.className='rs-right';
          blk.appendChild(rsR);
          rsR.addEventListener('mousedown', e => {
            e.stopPropagation(); e.preventDefault();
            const startX = e.clientX;
            const origDays = Math.round((sub.range.end - sub.range.start) / 86400000);
            showDragTip(`→ ${sub.range.end.getDate()} ${MON_PT[sub.range.end.getMonth()]}`, e.clientX, e.clientY);
            function onMove(ev) {
              const delta = Math.round((ev.clientX - startX) / DAY_W);
              const pending = new Date(sub.range.start.getTime() + Math.max(0, origDays + delta) * 86400000);
              blk._pendingEnd = pending;
              blk.title = `→ ${pending.getDate()} ${MON_PT[pending.getMonth()]}`;
              showDragTip(`→ ${pending.getDate()} ${MON_PT[pending.getMonth()]}`, ev.clientX, ev.clientY);
            }
            function onUp() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              hideDragTip();
              blk.title = sub.jobName;
              if(blk._pendingEnd) {
                pushUndo('range', sub, { start: new Date(sub.range.start), end: new Date(sub.range.end) });
                sub.range.end = blk._pendingEnd;
                updateRange(sub, sub.range.start, blk._pendingEnd);
                delete blk._pendingEnd;
                render();
              }
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });

          // Handle esquerdo — altera data início
          const rsL = document.createElement('div'); rsL.className='rs-left';
          blk.appendChild(rsL);
          rsL.addEventListener('mousedown', e => {
            e.stopPropagation(); e.preventDefault();
            const startX = e.clientX;
            const origStart = new Date(sub.range.start);
            function onMove(ev) {
              const delta = Math.round((ev.clientX - startX) / DAY_W);
              const newStart = new Date(origStart.getTime() + delta * 86400000);
              if(newStart < sub.range.end) blk._pendingStart = newStart;
            }
            function onUp() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              if(blk._pendingStart) {
                pushUndo('range', sub, { start: new Date(sub.range.start), end: new Date(sub.range.end) });
                sub.range.start = blk._pendingStart;
                updateRange(sub, blk._pendingStart, sub.range.end);
                delete blk._pendingStart;
                render();
              }
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });

          // Handle inferior — aumenta HS
          const rsB = document.createElement('div'); rsB.className='rs-bottom';
          blk.appendChild(rsB);
          rsB.addEventListener('mousedown', e => {
            e.stopPropagation(); e.preventDefault();
            const startY = e.clientY; const startHs = dayHs ?? sub.hsFallback;
            showDragTip(`HS: ${startHs}`, e.clientX, e.clientY);
            function onMove(ev) {
              const delta = Math.round((ev.clientY - startY) / PX_PER_HS);
              const pending = Math.max(1, startHs + delta);
              blk._pendingHs = pending;
              blk.title = `HS: ${pending}`;
              showDragTip(`HS: ${pending}`, ev.clientX, ev.clientY);
            }
            function onUp() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              hideDragTip();
              blk.title = sub.jobName;
              if(blk._pendingHs && blk._pendingHs !== startHs) {
                const newHsd = (sub.hsd||[sub.hsFallback]).map(v => v===startHs ? blk._pendingHs : v);
                pushUndo('hs', sub, sub.hsd ? [...sub.hsd] : [sub.hsFallback]);
                sub.hsd = newHsd;
                updateHSD(sub, newHsd);
                delete blk._pendingHs;
                render();
              }
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });

          // Handle superior — diminui HS
          const rsT = document.createElement('div'); rsT.className='rs-top';
          blk.appendChild(rsT);
          rsT.addEventListener('mousedown', e => {
            e.stopPropagation(); e.preventDefault();
            const startY = e.clientY; const startHs = dayHs ?? sub.hsFallback;
            showDragTip(`HS: ${startHs}`, e.clientX, e.clientY);
            function onMove(ev) {
              const delta = Math.round((ev.clientY - startY) / PX_PER_HS);
              const pending = Math.max(1, startHs - delta);
              blk._pendingHs = pending;
              blk.title = `HS: ${pending}`;
              showDragTip(`HS: ${pending}`, ev.clientX, ev.clientY);
            }
            function onUp() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              hideDragTip(); blk.title = sub.jobName;
              if(blk._pendingHs && blk._pendingHs !== startHs) {
                const newHsd = (sub.hsd||[sub.hsFallback]).map(v => v===startHs ? blk._pendingHs : v);
                pushUndo('hs', sub, sub.hsd ? [...sub.hsd] : [sub.hsFallback]);
                sub.hsd = newHsd;
                updateHSD(sub, newHsd);
                delete blk._pendingHs;
                render();
              }
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });

          blk.addEventListener('click', e => {
            if(e._dragged) return;
            monday.execute('openItemCard', {itemId: parseInt(sub.subId)});
          });

          // Shift+arrastar — cria novo segmento e actualiza HSD + Cronograma
          blk.addEventListener('mousedown', e => {
            if(!e.shiftKey) return;
            if(e.target.classList.contains('rs-right')||e.target.classList.contains('rs-left')||
               e.target.classList.contains('rs-bottom')||e.target.classList.contains('rs-top')||
               e.target.classList.contains('blk-menu-btn')) return;
            e.stopPropagation(); e.preventDefault();
            const startX = e.clientX;
            let dragColStart = colStart, dragColEnd = colEnd;
            const ghost = document.createElement('div');
            ghost.style.cssText = `position:fixed;opacity:0.55;pointer-events:none;z-index:9999;
              background:${cliColor(sub.clientCode)};border-radius:5px;padding:3px 7px;
              font-size:10px;color:#fff;font-weight:600;white-space:nowrap`;
            ghost.textContent = '+ ' + sub.jobName;
            document.body.appendChild(ghost);

            function onMove(ev) {
              const delta = Math.round((ev.clientX - startX) / DAY_W);
              dragColStart = colStart + delta;
              dragColEnd   = colEnd   + delta;
              ghost.style.left = (ev.clientX + 10) + 'px';
              ghost.style.top  = (ev.clientY + 10) + 'px';
              const dS = days[Math.max(0, dragColStart)];
              const dE = days[Math.min(TOTAL_DAYS-1, dragColEnd)];
              if(dS && dE) ghost.textContent = `+ ${dS.getDate()}/${dS.getMonth()+1} → ${dE.getDate()}/${dE.getMonth()+1}`;
            }
            function onUp() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              ghost.remove();
              if(dragColStart === colStart) return; // não moveu

              const newSegStart = days[Math.max(0, dragColStart)];
              const newSegEnd   = days[Math.min(TOTAL_DAYS-1, dragColEnd)];
              if(!newSegStart || !newSegEnd) return;

              // Nova range total: min→max
              const extStart = new Date(Math.min(sub.range.start, newSegStart));
              const extEnd   = new Date(Math.max(sub.range.end,   newSegEnd));

              // Calcula todos os dias úteis na range extendida
              const extWorkDays = [];
              const allDays = getAllDays();
              allDays.forEach(d => {
                if(d >= extStart && d <= extEnd && !isBlocked(d)) extWorkDays.push(d);
              });

              // Para cada dia útil, calcula o HSD
              const origWork = [];
              allDays.forEach(d => {
                if(d >= sub.range.start && d <= sub.range.end && !isBlocked(d)) origWork.push(fmtD(d));
              });
              const newSegWork = [];
              allDays.forEach(d => {
                if(d >= newSegStart && d <= newSegEnd && !isBlocked(d)) newSegWork.push(fmtD(d));
              });

              const lastOrigHs = sub.hsd ? (sub.hsd[sub.hsd.length-1] ?? sub.hsFallback) : sub.hsFallback;

              const newHsd = extWorkDays.map(d => {
                const ds = fmtD(d);
                const origPos = origWork.indexOf(ds);
                if(origPos !== -1) {
                  // Dia original → usa valor HSD original
                  if(!sub.hsd||sub.hsd.length===0) return sub.hsFallback;
                  return sub.hsd[Math.min(origPos, sub.hsd.length-1)];
                }
                if(newSegWork.includes(ds)) return lastOrigHs; // novo segmento
                return 0; // gap
              });

              sub.range.start = extStart;
              sub.range.end   = extEnd;
              sub.hsd = newHsd;

              updateRange(sub, extStart, extEnd);
              updateHSD(sub, newHsd);
              render();
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });

          // Arrastar normal (sem Shift)
          // Arrastar verticalmente muda a ordem da pessoa
          blk.addEventListener('mousedown', e => {
            if(e.target.classList.contains('rs-right')||e.target.classList.contains('rs-left')||
               e.target.classList.contains('rs-bottom')||e.target.classList.contains('rs-top')||
               e.target.classList.contains('blk-menu-btn')) return;
            const startX=e.clientX, startY=e.clientY;
            let mode=null; // 'reorder' | 'move'
            const ghost = document.createElement('div');
            ghost.style.cssText=`position:fixed;opacity:0.6;pointer-events:none;z-index:9999;border-radius:5px;background:${cliColor(sub.clientCode)};padding:4px 8px;font-size:10px;color:#fff;font-weight:600;white-space:nowrap;display:none`;
            ghost.textContent=sub.jobName;
            document.body.appendChild(ghost);

            function onMove(ev) {
              const dx=ev.clientX-startX, dy=ev.clientY-startY;
              if(!mode && (Math.abs(dx)>12||Math.abs(dy)>12)) {
                mode = Math.abs(dy)>Math.abs(dx) ? 'reorder' : 'move';
              }
              if(mode==='reorder') {
                ev._dragged=true;
                ghost.style.display='block';
                ghost.style.left=(ev.clientX+10)+'px';
                ghost.style.top=(ev.clientY+10)+'px';
                blk.style.opacity='0.4';
              } else if(mode==='move') {
                const delta=Math.round(dx/DAY_W);
                const newStart=new Date(sub.range.start.getTime()+delta*86400000);
                const newEnd=new Date(sub.range.end.getTime()+delta*86400000);
                blk._pendingStart=newStart; blk._pendingEnd=newEnd;
                blk.style.opacity='0.7';
                // Feedback: mostra as datas
                ghost.style.display='block';
                ghost.style.left=(ev.clientX+10)+'px';
                ghost.style.top=(ev.clientY+10)+'px';
                ghost.textContent=`${newStart.getDate()} ${MON_PT[newStart.getMonth()]} → ${newEnd.getDate()} ${MON_PT[newEnd.getMonth()]}`;
              }
            }

            function onUp(ev) {
              document.removeEventListener('mousemove',onMove);
              document.removeEventListener('mouseup',onUp);
              ghost.remove();
              blk.style.opacity='1';

              if(mode==='reorder') {
                // Encontra qual bloco está na posição Y atual
                const allBlks = [...document.querySelectorAll('.blk')];
                const targetBlk = allBlks.find(b=>{
                  if(b===blk) return false;
                  const r=b.getBoundingClientRect();
                  return ev.clientY>=r.top && ev.clientY<=r.bottom;
                });
                if(targetBlk && targetBlk._subId) {
                  const arr=[...new Set([...sortedSubs.map(s=>s.subId)])];
                  const fromIdx=arr.indexOf(sub.subId);
                  const toIdx=arr.indexOf(targetBlk._subId);
                  if(fromIdx!==-1&&toIdx!==-1) {
                    arr.splice(fromIdx,1); arr.splice(toIdx,0,sub.subId);
                  }
                  subOrder[p.person]=arr;
                  localStorage.setItem('subOrder_9mm',JSON.stringify(subOrder));
                  render();
                }
              } else if(mode==='move' && blk._pendingStart) {
                ev._dragged=true;
                pushUndo('range',sub,{start:new Date(sub.range.start),end:new Date(sub.range.end)});
                sub.range.start=blk._pendingStart; sub.range.end=blk._pendingEnd;
                updateRange(sub,blk._pendingStart,blk._pendingEnd);
                delete blk._pendingStart; delete blk._pendingEnd;
                render();
              } else if(!mode) {
                // click simples
              }
            }
            document.addEventListener('mousemove',onMove);
            document.addEventListener('mouseup',onUp);
          });
          blk._subId = sub.subId; // para o drag-to-reorder identificar o alvo

          // ⋮ Menu de contexto
          const menuBtn = document.createElement('button');
          menuBtn.className='blk-menu-btn'; menuBtn.textContent='⋮';
          blk.appendChild(menuBtn);
          menuBtn.addEventListener('click', e => {
            e.stopPropagation();
            const dd = document.getElementById('blk-dd');
            const rect = menuBtn.getBoundingClientRect();
            dd.innerHTML='';
            const mkLabel = t => { const d=document.createElement('div'); d.className='dd-label'; d.textContent=t; return d; };
            const mkSep   = () => { const d=document.createElement('div'); d.className='dd-sep'; return d; };
            const mkItem  = (icon,label,fn) => {
              const d=document.createElement('div'); d.className='dd-item';
              d.innerHTML=icon+' '+label;
              d.addEventListener('click',()=>{ closeDD(); fn(); });
              return d;
            };
            dd.appendChild(mkLabel('Job'));
            dd.appendChild(mkItem('📋', sub.jobName||'Abrir Job', ()=>monday.execute('openItemCard',{itemId:parseInt(sub.parentId)})));
            if(sub.siblings && sub.siblings.length){
              dd.appendChild(mkSep());
            dd.appendChild(mkLabel('Subelemento'));
              sub.siblings.forEach(sib=>{
                const isMe = sib.subId===sub.subId;
                const itm = mkItem(isMe?'▶':'↳', sib.tipo||'Subitem', ()=>monday.execute('openItemCard',{itemId:parseInt(sib.subId)}));
                if(isMe) itm.style.color='#7c83f5';
                dd.appendChild(itm);
              });
            }
            const ddW=180;
            let left=rect.right+4;
            if(left+ddW>window.innerWidth) left=rect.left-ddW-4;
            dd.style.cssText=`display:block;top:${rect.bottom+2}px;left:${Math.max(4,left)}px`;
          });

          pdays.appendChild(blk);
        });
      });
    });

    // Scroll label inicial
    updateWeekLabel(days);
  }

  function populateFilter() {
    const dd = document.getElementById('fperson-dd');
    const names = [...new Set(allData.map(p=>p.person))].sort((a,b)=>a.localeCompare(b));
    dd.innerHTML = '';
    // "Todas" option
    const allLbl = document.createElement('label'); allLbl.className='fperson-all';
    const allCk = document.createElement('input'); allCk.type='checkbox'; allCk.id='fperson-all';
    allCk.checked = selPersons.length === 0;
    allLbl.appendChild(allCk); allLbl.appendChild(document.createTextNode(' Todas as pessoas'));
    dd.appendChild(allLbl);
    allCk.addEventListener('change', () => {
      if(allCk.checked) {
        selPersons = [];
        dd.querySelectorAll('input[data-person]').forEach(c => c.checked=false);
      }
      updatePersonBtn(); localStorage.setItem('filter_persons_9mm', JSON.stringify(selPersons)); render();
    });
    names.forEach(name => {
      const lbl = document.createElement('label');
      const ck = document.createElement('input'); ck.type='checkbox'; ck.dataset.person=name;
      ck.checked = selPersons.includes(name);
      lbl.appendChild(ck); lbl.appendChild(document.createTextNode(' '+name));
      lbl.addEventListener('change', () => {
        if(ck.checked) { if(!selPersons.includes(name)) selPersons.push(name); }
        else { selPersons = selPersons.filter(p=>p!==name); }
        allCk.checked = selPersons.length === 0;
        updatePersonBtn(); localStorage.setItem('filter_persons_9mm', JSON.stringify(selPersons)); render();
      });
      dd.appendChild(lbl);
    });
    updatePersonBtn();
  }

  function updatePersonBtn() {
    const btn = document.getElementById('fperson-btn');
    btn.textContent = selPersons.length === 0
      ? 'Todas as pessoas'
      : selPersons.length === 1 ? selPersons[0] : `${selPersons.length} pessoas`;
  }


  function populateTipo() {
    const sel=document.getElementById('ftipo'); const cur=sel.value;
    const tipos=[...new Set(allData.flatMap(p=>p.subitems.map(s=>s.tipo)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    sel.innerHTML='<option value="">Todos os tipos</option>';
    tipos.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; if(t===cur) o.selected=true; sel.appendChild(o); });
  }

  function populateSetor() {
    const sel=document.getElementById('fsetor'); const cur=sel.value;
    const setores=[...new Set(allData.flatMap(p=>p.subitems.map(s=>s.setor)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    sel.innerHTML='<option value="">Todos os setores</option>';
    setores.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; if(s===cur) o.selected=true; sel.appendChild(o); });
  }

  function renderHolidayList() {
    const list=document.getElementById('holiday-list'); list.innerHTML='';
    if(!holidays.length){ list.innerHTML='<span style="font-size:12px;color:#666">Nenhum feriado cadastrado.</span>'; return; }
    holidays.forEach(h=>{
      const item=document.createElement('div'); item.className='h-item';
      item.innerHTML=`<span>${h}</span><button class="h-del" data-date="${h}">&#x2715;</button>`;
      list.appendChild(item);
    });
    list.querySelectorAll('.h-del').forEach(btn=>{
      btn.addEventListener('click',()=>{
        holidays=holidays.filter(x=>x!==btn.dataset.date);
        localStorage.setItem('holidays_9mm',JSON.stringify(holidays));
        renderHolidayList(); render();
      });
    });
  }

  // ── Dropdown global ───────────────────────────────────────
  function closeDD() { document.getElementById('blk-dd').style.display='none'; }
  document.addEventListener('click', e => {
    const dd = document.getElementById('blk-dd');
    if(dd && dd.style.display==='block' && !dd.contains(e.target)) closeDD();
  });

  // ── Eventos de scroll ─────────────────────────────────────
  const wrap = document.getElementById('tl-wrap');

  // Shift+Scroll → scroll horizontal
  wrap.addEventListener('wheel', e=>{
    if(e.shiftKey){ e.preventDefault(); wrap.scrollLeft+=e.deltaY; }
  }, {passive:false});

  // Scroll label dinâmico
  wrap.addEventListener('scroll', ()=>{ updateWeekLabel(getAllDays()); });

  // ── Arrastar espaço vazio para pan ────────────────────────
  let isPanning=false, panStartX=0, panStartY=0, panScrollLeft=0, panScrollTop=0;
  wrap.addEventListener('mousedown', e=>{
    if(e.target!==wrap && !e.target.classList.contains('pdcell') && !e.target.classList.contains('pdays')) return;
    isPanning=true; panStartX=e.clientX; panStartY=e.clientY;
    panScrollLeft=wrap.scrollLeft; panScrollTop=wrap.scrollTop;
    wrap.style.cursor='grabbing'; wrap.style.userSelect='none';
  });
  document.addEventListener('mousemove', e=>{
    if(!isPanning) return;
    wrap.scrollLeft = panScrollLeft - (e.clientX - panStartX);
    wrap.scrollTop  = panScrollTop  - (e.clientY - panStartY);
  });
  document.addEventListener('mouseup', ()=>{
    if(isPanning){ isPanning=false; wrap.style.cursor=''; wrap.style.userSelect=''; }
  });

  // ── Eventos de UI ─────────────────────────────────────────
  document.getElementById('btn-refresh').addEventListener('click', () => refreshData(false));
  document.getElementById('bp').addEventListener('click', ()=>scrollByWeeks(-1));
  document.getElementById('bn').addEventListener('click', ()=>scrollByWeeks(1));
  document.getElementById('btn-today').addEventListener('click', scrollToToday);
  document.getElementById('sort-controls').addEventListener('click', e => {
    const btn = e.target.closest('.sort-btn');
    if(!btn) return;
    sortMode = btn.dataset.sort;
    localStorage.setItem('filter_sort_9mm', sortMode);
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b===btn));
    render();
  });

  // Multi-select pessoa — toggle dropdown
  const fpersonBtn = document.getElementById('fperson-btn');
  const fpersonDd  = document.getElementById('fperson-dd');
  fpersonBtn.addEventListener('click', e => { e.stopPropagation(); fpersonDd.classList.toggle('open'); });
  document.addEventListener('click', e => { if(!fpersonDd.contains(e.target) && e.target!==fpersonBtn) fpersonDd.classList.remove('open'); });
  document.getElementById('ftipo').addEventListener('change', e=>{ selTipo=e.target.value; localStorage.setItem('filter_tipo_9mm', selTipo); render(); });
  document.getElementById('fsetor').addEventListener('change', e=>{ selSetor=e.target.value; localStorage.setItem('filter_setor_9mm', selSetor); render(); });

  const fsearch = document.getElementById('fsearch');
  const fsearchClear = document.getElementById('fsearch-clear');
  fsearch.addEventListener('input', e=>{
    searchQuery=e.target.value.trim();
    fsearchClear.classList.toggle('visible', searchQuery.length>0);
    render();
  });
  fsearchClear.addEventListener('click', ()=>{
    fsearch.value=''; searchQuery='';
    fsearchClear.classList.remove('visible');
    render();
  });

  document.getElementById('btn-add-h').addEventListener('click', ()=>{
    const val=document.getElementById('holiday-input').value;
    if(val&&!holidays.includes(val)){ holidays.push(val); localStorage.setItem('holidays_9mm',JSON.stringify(holidays)); renderHolidayList(); render(); document.getElementById('holiday-input').value=''; }
  });
  document.getElementById('bcfg').addEventListener('click', ()=>{ renderHolidayList(); document.getElementById('modal-overlay').classList.add('open'); });
  document.getElementById('btn-close-modal').addEventListener('click', ()=>{ document.getElementById('modal-overlay').classList.remove('open'); });
  document.getElementById('bpesos').addEventListener('click', ()=>{
    const wr=document.getElementById('w-rows'); wr.innerHTML='';
    const defRow=document.createElement('div'); defRow.className='w-row';
    defRow.innerHTML=`<label>Padrão (sem HS preenchido)</label><input type="number" id="default-hs-input" value="${defaultHs}" min="1" max="20"/>`;
    wr.appendChild(defRow);
    document.getElementById('weights-panel').classList.add('open');
  });
  document.getElementById('btn-save-w').addEventListener('click', ()=>{
    const defInput=document.getElementById('default-hs-input');
    if(defInput) defaultHs=parseInt(defInput.value)||7;
    localStorage.setItem('default_hs_9mm',String(defaultHs));
    document.getElementById('weights-panel').classList.remove('open'); render();
  });
  document.getElementById('btn-close-w').addEventListener('click', ()=>{ document.getElementById('weights-panel').classList.remove('open'); });

  personOrder=JSON.parse(localStorage.getItem('order_9mm')||'[]');

  // ── Init ──────────────────────────────────────────────────
  monday.listen('context', async res => {
    const boardId = res.data.boardId || (res.data.boardIds && res.data.boardIds[0]);
    currentBoardId = boardId;
    const currentUserName = res.data.user?.name || '';
    const currentUserId   = res.data.user?.id;
    isMainAdmin = res.data.user?.isAdmin === true ||
                  (ADMIN_USER_ID && String(currentUserId) === String(ADMIN_USER_ID));

    // Carrega sub-admins do Monday Storage antes de decidir acesso
    await loadSubAdmins();
    const isSubAdmin = subAdmins.includes(String(currentUserId));
    isAdmin = isMainAdmin || isSubAdmin;

    if(isAdmin) document.querySelectorAll('.admin-only').forEach(el=>el.style.display='inline-flex');
    if(isMainAdmin) document.getElementById('baccess').style.display='inline-flex';

    try {
      const items = await fetchData(boardId);
      allData = processItems(items);
      await fetchUsers();

      // Resolve nome e filtra se não for admin
      if(!isAdmin) {
        const resolvedName = currentUserName || userNameById[String(currentUserId)] || '';
        selPersons = resolvedName ? [resolvedName] : [];
        console.log('Membro filtrado para:', resolvedName || '(sem match)');
      }

      populateFilter();
      populateTipo();
      populateSetor();
      if(isAdmin) {
        document.getElementById('ftipo').value   = selTipo;
        document.getElementById('fsetor').value  = selSetor;
        updatePersonBtn();
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort===sortMode));
      }
      document.getElementById('loading').style.display='none';
      document.getElementById('tl-outer').style.display='flex';
      render();
      requestAnimationFrame(()=>{
        const days=getAllDays();
        const idx=todayIndex(days);
        if(idx>=0) wrap.scrollLeft=scrollXForIndex(idx);
        updateWeekLabel(days);
      });
    } catch(err) {
      document.getElementById('loading').innerHTML=`<span style="color:#ef5350">Erro: ${err.message}</span>`;
      console.error(err);
    }
  });
}
</script>
</body>
